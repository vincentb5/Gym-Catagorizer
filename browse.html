<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IronScan — Browse Equipment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="nav-logo"><span class="logo-text">IRON<span class="logo-dot">SCAN</span></span></a>
      <ul class="nav-links">
        <li><a href="/">Scanner</a></li>
        <li><a href="browse.html" class="active">Browse</a></li>
        <li><a href="compare.html">Compare</a></li>
        <li><a href="history.html">History</a></li>
      </ul>
      <a href="/" class="nav-cta">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        Scan Now
      </a>
      <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
    </div>
    <div class="mobile-menu" id="mobileMenu">
      <a href="/">Scanner</a>
      <a href="browse.html">Browse</a>
      <a href="compare.html">Compare</a>
      <a href="history.html">History</a>
      <a href="/" class="mobile-cta">Scan Now</a>
    </div>
  </nav>

  <div class="page-header">
    <div class="container">
      <p class="section-label">Equipment catalog</p>
      <h1>Browse Gym Equipment</h1>
      <p>Explore common gym equipment types with average resale price ranges.</p>
    </div>
  </div>

  <div style="padding:40px 0 80px;">
    <div class="container">

      <div class="browse-controls">
        <input type="text" class="search-input" id="searchInput" placeholder="Search equipment…">
        <div class="filter-tabs" id="filterTabs">
          <button class="filter-tab active" data-cat="All">All</button>
          <button class="filter-tab" data-cat="Free Weights">Free Weights</button>
          <button class="filter-tab" data-cat="Cardio">Cardio</button>
          <button class="filter-tab" data-cat="Machines">Machines</button>
          <button class="filter-tab" data-cat="Accessories">Accessories</button>
          <button class="filter-tab" data-cat="Recovery">Recovery</button>
        </div>
      </div>

      <div class="equipment-grid" id="equipmentGrid"></div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bottom">
      <div class="container">
        <p>© 2026 IronScan. All rights reserved.</p>
        <p>Prices are estimated used resale averages.</p>
      </div>
    </div>
  </footer>

  <script src="browse.js"></script>
</body>
</html>
